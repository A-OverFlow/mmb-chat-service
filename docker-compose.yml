services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CHAT_SERVICE_NAME}
    image: mumulbo/mmb-chat-service:IMAGE_TAG_PLACEHOLDER
    env_file:
      - .env
    ports:
      - "${SERVICE_PORT}:8084"
    networks:
      - external-net
    depends_on:
      - db
      - mongo
      - redis-chat
    logging:
      driver: json-file
      options:
          max-size: "10m"
          max-file: "5"

  db:
    image: mysql:8
    container_name: ${CHAT_SERVICE_NAME}-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - external-net

  redis-chat:
    image: redis:7.2
    container_name: ${CHAT_SERVICE_NAME}-redis
    ports:
      - "6380:6380"
    command: redis-server --port 6380
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
    networks:
      - external-net

  mongo:
    image: mongo:6.0
    container_name: ${CHAT_SERVICE_NAME}-mongo
    ports:
      - "${MONGO_PORT}:${MONGO_PORT}"
    volumes:
      - mongo_data:/data/db
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.1'
    networks:
      - external-net

volumes:
  mysql_data:
  mongo_data:

networks:
  external-net:
    external: true
    name: ${MMB_DOCKER_NETWORK}
