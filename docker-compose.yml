version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ms-msa-playground:local
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - external-net
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: local-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - external-net

volumes:
  mysql_data:

networks:
  external-net:
    external: true
    name: sample-network