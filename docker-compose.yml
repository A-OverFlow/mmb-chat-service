services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mumulbo/mmb-ms-msa-playground:IMAGE_TAG_PLACEHOLDER
    env_file:
      - .env
    ports:
      - "${SERVICE_PORT}:8084"
    networks:
      - external-net
    depends_on:
      - db
    logging:
      driver: json-file
      options:
          max-size: "10m"
          max-file: "5"

  db:
    image: mysql:8.0
    container_name: ${CHAT_SERVICE_NAME}-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - external-net

  redis:
    image: redis:7.2
    container_name: ${CHAT_SERVICE_NAME}-redis
    ports:
      - "${REDIS_PORT}:6379"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
    networks:
      - external-net

  mongo:
    image: mongo:6.0
    container_name: ${CHAT_SERVICE_NAME}-mongo
    ports:
      - "${MONGO_PORT}:${MONGO_PORT}"
    volumes:
      - mongo_data:/data/db
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - external-net

volumes:
  mysql_data:
  mongo_data:

networks:
  external-net:
    external: true
    name: sample-network
