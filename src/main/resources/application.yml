server:
  port: ${SERVICE_PORT:8080}

spring:
  web:
    resources:
      static-locations: classpath:/static/
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${CONTAINER_DB_PORT:3308}/${DB_NAME:sample_db}?allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:sample_user}
    password: ${DB_PASSWORD:sample_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}  # ?? ? validate ?? none ??
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
        dialect: org.hibernate.dialect.MariaDBDialect

logging:
  level:
    root: ${LOG_ROOT_LEVEL:info}
    org.springframework.web: ${LOG_WEB_LEVEL:debug}
    com.mumulbo.msaplayground: ${LOG_APP_LEVEL:debug}  # ???? ??? ??