<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sample Time List</title>
</head>
<body>
<h1>Sample Time List</h1>

<button onclick="fetchList()">Refresh List</button>
<button onclick="deleteAll()">Delete All</button>

<ul id="timeList"></ul>

<script>
  async function fetchList() {
    const response = await fetch('/api/sample/list');
    const times = await response.json();
    const list = document.getElementById('timeList');
    list.innerHTML = '';
    times.forEach(time => {
      const li = document.createElement('li');
      li.textContent = time.currentTime;
      list.appendChild(li);
    });
  }

  async function deleteAll() {
    await fetch('/api/sample', { method: 'DELETE' });
    fetchList();
  }

  window.onload = fetchList;
</script>
</body>
</html>
